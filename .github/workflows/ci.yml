name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Native Shell's GTK 4 backend needs GTK 4.14 (Ubuntu 24.04).
  GTK_DEPS: libgtk-4-dev pkg-config clang
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Make room (the emulator's build is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Patch AWS Emulator (see patches/)
        run: git -C third_party/aws-emulator apply ../../patches/aws-emulator-observer.patch
      - run: sudo apt-get update && sudo apt-get install -y $GTK_DEPS xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # The end-to-end tests drive whole apps with boto3.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install boto3
      - run: cargo fmt -p lenslet -p lenslet-core -- --check
      - run: cargo test --workspace --locked
      - name: End to end (the call tree; rewind, grants, saved accounts)
        env:
          LENSLET_PYTHON: python
        run: cargo test --locked -p lenslet --test chain --test rewind -- --ignored --nocapture
      - run: cargo build --release --locked -p lenslet
      - name: The window starts and serves AWS
        run: |
          xvfb-run -a target/release/lenslet &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4510/ && exit 0; sleep 1; done; exit 1
      - run: bash scripts/package-linux.sh 0.0.0-ci dist

  macos:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Patch AWS Emulator (see patches/)
        run: |
          git -C third_party/aws-emulator apply ../../patches/aws-emulator-observer.patch
          git -C third_party/aws-emulator apply ../../patches/aws-emulator-macos.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install boto3
      - run: cargo test --workspace --locked
      - name: End to end (the call tree; rewind, grants, saved accounts)
        env:
          LENSLET_PYTHON: python
        run: cargo test --locked -p lenslet --test chain --test rewind -- --ignored --nocapture
      # CI builds the native (Apple silicon) app only; the release adds x86_64.
      - run: cargo build --release --locked --target aarch64-apple-darwin -p lenslet
      - run: bash scripts/package-macos.sh 0.0.0-ci dist
