name: Release

on:
  push:
    tags: ['lenslet-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'lenslet-v* tag to publish (created at the dispatched commit if it does not exist)'
        required: true
        default: 'lenslet-v18.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GTK_DEPS: libgtk-4-dev pkg-config clang
  CARGO_INCREMENTAL: 0

jobs:
  # The commit to build: the tag's, or (dispatch with a new tag) the dispatched one.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in lenslet-v[0-9]*) ;; *) echo "not a lenslet-v* tag: $TAG"; exit 1 ;; esac
          if ! SHA=$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha 2>/dev/null); then
            SHA="${GITHUB_SHA}"   # new tag: release the dispatched commit
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha: $SHA"; exit 1; }
          echo "building ${TAG} at ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  linux:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        # 24.04: GTK 4.14, which Native Shell needs.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Make room (the emulator's build is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: true
      - name: Patch AWS Emulator (see patches/)
        run: git -C third_party/aws-emulator apply ../../patches/aws-emulator-observer.patch
      - run: sudo apt-get update && sudo apt-get install -y $GTK_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # CI ran the tests on this commit; building them again here doubled
      # the emulator build and ran the arm64 runner out of resources.
      - run: cargo build --release --locked -p lenslet
      - run: df -h . && free -m
      - name: Package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: bash scripts/package-linux.sh "${TAG#lenslet-v}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: true
      - name: Patch AWS Emulator (see patches/)
        run: |
          git -C third_party/aws-emulator apply ../../patches/aws-emulator-observer.patch
          git -C third_party/aws-emulator apply ../../patches/aws-emulator-macos.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-apple-darwin -p lenslet
      - run: cargo build --release --locked --target x86_64-apple-darwin -p lenslet
      - name: Package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: bash scripts/package-macos.sh "${TAG#lenslet-v}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG#lenslet-v}"
          cd dist
          sha256sum *.tar.gz *.dmg > SHA256SUMS
          cat SHA256SUMS
          FILES=(*.tar.gz *.dmg SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "$SHA" \
              --title "Lenslet ${VERSION}" \
              --notes-file ../RELEASE_NOTES.md \
              --latest
          fi
          echo "published $TAG"
