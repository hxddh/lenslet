name: Lenslet
description: Run your tests against a local AWS emulator and show, in the PR, the AWS access they need and why their AWS calls failed.
author: hxddh
branding:
  icon: eye
  color: blue

inputs:
  command:
    description: The test command, e.g. `npm test`. Runs under bash in working-directory.
    required: true
  upstream:
    description: The emulator, as `auto` (an emulator already running in the job, found by its protocol, else moto when it is installed), `moto` (the action installs moto and Lenslet starts and stops it), a port (HTTPS on 127.0.0.1) or an http(s) URL.
    default: 'auto'
  emulator:
    description: '`moto` (same as `upstream: moto`), or a command that starts the emulator in the background; the action then waits for `upstream` to accept connections.'
    default: ''
  working-directory:
    description: Where to run the command and look for the lock file.
    default: '.'
  lock:
    description: Lock file path (relative to working-directory). Default lenslet.lock. The run fails (exit 3) when it uses access the lock does not list; while there is no lock file yet, it only reports.
    default: ''
  policy:
    description: An IAM policy JSON document (relative to working-directory). After the run, `lenslet check --policy` checks the run's access against it and fails (exit 3) when the policy denies any of it.
    default: ''
  strict:
    description: Also fail when the lock lists access the run did not use.
    default: 'false'
  comment:
    description: On pull requests, post the report as one comment and keep it updated. Needs `pull-requests write` permission.
    default: 'true'
  version:
    description: Lenslet version to install, e.g. `13.0.0`. Default is the version this action is pinned to (`hxddh/lenslet@lenslet-v13.0.0` installs 13.0.0).
    default: ''
  binary:
    description: Use this lenslet binary instead of installing one (for builds from source).
    default: ''

outputs:
  exit-code:
    description: The outcome. The command's own code when it failed; 3 when the run used access not in the lock (or, with strict, left lock lines unused) or the policy denied some of it; 2 when Lenslet could not run; else 0.
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: Path to the JSON report of the run.
    value: ${{ steps.run.outputs.report }}
  markdown:
    description: Path to the Markdown report (the run, then the policy check when `policy` is set).
    value: ${{ steps.run.outputs.markdown }}

runs:
  using: composite
  steps:
    - name: Install lenslet
      shell: bash
      env:
        INPUT_BINARY: ${{ inputs.binary }}
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_BINARY" ]; then
          bin=$(cd "$(dirname "$INPUT_BINARY")" && pwd)/$(basename "$INPUT_BINARY")
        else
          version="${INPUT_VERSION:-${ACTION_REF#lenslet-v}}"
          case "$version" in
            [0-9]*) ;;
            *) echo "::error::Pin the action to a release (hxddh/lenslet@lenslet-vX.Y.Z) or set the version input"; exit 2 ;;
          esac
          sh "$GITHUB_ACTION_PATH/install.sh" --version "$version" --dir "$RUNNER_TEMP/lenslet-bin"
          bin="$RUNNER_TEMP/lenslet-bin/lenslet"
        fi
        "$bin" --version
        echo "LENSLET_BIN=$bin" >> "$GITHUB_ENV"

    - name: Choose the emulator
      id: mode
      shell: bash
      env:
        UPSTREAM: ${{ inputs.upstream }}
        EMULATOR: ${{ inputs.emulator }}
      run: |
        set -euo pipefail
        managed=false
        if [ "$UPSTREAM" = "moto" ] || [ "$EMULATOR" = "moto" ]; then
          managed=true
        fi
        echo "managed=$managed" >> "$GITHUB_OUTPUT"

    - name: Install moto
      if: steps.mode.outputs.managed == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v moto_server >/dev/null 2>&1 || python3 -c 'import moto.server' 2>/dev/null; then
          echo "moto is installed"
        elif python3 -m pip install --quiet 'moto[server]'; then
          echo "installed moto with pip"
        else
          # A Python that refuses system-wide installs (PEP 668): use a venv.
          python3 -m venv "$RUNNER_TEMP/lenslet-moto"
          "$RUNNER_TEMP/lenslet-moto/bin/pip" install --quiet 'moto[server]'
          echo "$RUNNER_TEMP/lenslet-moto/bin" >> "$GITHUB_PATH"
          echo "installed moto in $RUNNER_TEMP/lenslet-moto"
        fi

    - name: Start the emulator
      if: inputs.emulator != '' && steps.mode.outputs.managed != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EMULATOR: ${{ inputs.emulator }}
        UPSTREAM: ${{ inputs.upstream }}
      run: |
        set -euo pipefail
        nohup bash -c "$EMULATOR" > "$RUNNER_TEMP/lenslet-emulator.log" 2>&1 &
        if [ "$UPSTREAM" = "auto" ]; then
          UPSTREAM="9298"
        fi
        address="${UPSTREAM#*://}"
        address="${address%%/*}"
        case "$address" in *:*) ;; *) address="127.0.0.1:$address" ;; esac
        host="${address%:*}"; port="${address##*:}"
        host="${host#[}"; host="${host%]}"
        [ "$host" = "localhost" ] && host=127.0.0.1
        for _ in $(seq 120); do
          if (exec 3<>"/dev/tcp/$host/$port") 2>/dev/null; then
            echo "emulator is up on $host:$port"
            exit 0
          fi
          sleep 0.5
        done
        echo "::error::the emulator did not open $host:$port within 60 s"
        tail -n 50 "$RUNNER_TEMP/lenslet-emulator.log" || true
        exit 2

    - name: Run under Lenslet
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        UPSTREAM: ${{ inputs.upstream }}
        EMULATOR: ${{ inputs.emulator }}
        MANAGED: ${{ steps.mode.outputs.managed }}
        LOCK: ${{ inputs.lock }}
        POLICY: ${{ inputs.policy }}
        STRICT: ${{ inputs.strict }}
      run: |
        # GitHub runs this with `bash -e`: a failing lenslet must not end the
        # step before the summary and outputs are written.
        set +e -uo pipefail
        # Each invocation gets its own files: a run that fails before writing
        # its report must not show a previous invocation's.
        dir=$(mktemp -d "$RUNNER_TEMP/lenslet.XXXXXX")
        report="$dir/report.json"
        markdown="$dir/report.md"
        if [ "$MANAGED" = "true" ]; then
          args=(run --emulator moto)
        elif [ "$UPSTREAM" = "auto" ]; then
          if [ -n "$EMULATOR" ]; then
            args=(run --upstream 9298)
          else
            args=(run)
          fi
        else
          args=(run --upstream "$UPSTREAM")
        fi
        args+=(--json "$report" --markdown "$markdown")
        lock="${LOCK:-lenslet.lock}"
        args+=(--lock "$lock")
        if [ -f "$lock" ]; then
          args+=(--check)
          [ "$STRICT" = "true" ] && args+=(--strict)
        else
          echo "::notice::No $lock yet: reporting only. Create it with \`lenslet run --update -- $COMMAND\` and commit it."
        fi
        "$LENSLET_BIN" "${args[@]}" -- bash -c "$COMMAND"
        code=$?
        if [ "$code" = "3" ] && command -v jq >/dev/null 2>&1 && [ -f "$report" ]; then
          while IFS=$'\t' read -r action resource; do
            [ -n "$action" ] || continue
            echo "::error file=$lock,title=New AWS permission::+ $action on $resource (if intended, accept it with \`lenslet run --update\` and commit $lock)"
          done < <(jq -r '.access[] | select(.new == true) | [.action, .resource] | @tsv' "$report")
          if [ "$STRICT" = "true" ]; then
            while IFS=$'\t' read -r action resource; do
              [ -n "$action" ] || continue
              line=$(awk -v a="$action" -v r="$resource" '$1 == a && $2 == r { print NR; exit }' "$lock")
              echo "::error file=$lock${line:+,line=$line},title=Unused AWS permission::- $action on $resource was not exercised by this run"
            done < <(jq -r '.access[] | select(.unused == true) | [.action, .resource] | @tsv' "$report")
          fi
          echo "::error::AWS access changed: see the job summary. If it is intended, run \`lenslet run --update\` and commit $lock."
        fi
        # The policy check: the run's own access, against the policy.
        if [ -n "$POLICY" ] && [ -f "$report" ]; then
          trace=$(command -v jq >/dev/null 2>&1 && jq -r '.trace' "$report" || true)
          check_json="$dir/check.json"
          check_md="$dir/check.md"
          "$LENSLET_BIN" check --policy "$POLICY" ${trace:+"$trace"} --json --markdown "$check_md" > "$check_json"
          check=$?
          [ -f "$check_md" ] && { echo; cat "$check_md"; } >> "$markdown"
          if [ "$check" = "3" ]; then
            if command -v jq >/dev/null 2>&1; then
              while IFS=$'\t' read -r action resource why; do
                [ -n "$action" ] || continue
                echo "::error file=$POLICY,title=Denied by the IAM policy::$action on $resource ($why)"
              done < <(jq -r '.denied[] | [.action, .resource, (if .conditional then "statement \(.by) is conditional: not evaluated" elif .reason == "explicit_deny" then "denied by statement \(.by)" else "no statement allows it" end)] | @tsv' "$check_json" | sort -u)
            fi
            echo "::error::$POLICY does not allow all the access this run used: see the job summary. Grant it in $POLICY, or change the code that needs it."
          elif [ "$check" != "0" ]; then
            echo "::error::lenslet check --policy $POLICY could not run (exit $check)"
          fi
          if [ "$code" = "0" ] && [ "$check" != "0" ]; then
            code=$check
          fi
        fi
        [ -f "$markdown" ] && cat "$markdown" >> "$GITHUB_STEP_SUMMARY"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$report" ]; then
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "markdown=$markdown" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        MARKDOWN: ${{ steps.run.outputs.markdown }}
      run: |
        # Commenting is best effort (fork PRs get a read-only token).
        set +e -uo pipefail
        markdown="$MARKDOWN"
        [ -n "$markdown" ] && [ -f "$markdown" ] || exit 0
        marker="<!-- lenslet-report -->"
        body="$marker
        $(cat "$markdown")"
        # Only a numeric id counts: on an API error gh prints the error body.
        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" 2>/dev/null \
          | grep -E '^[0-9]+$' | head -n 1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
        fi || echo "::warning::Could not comment on the PR (forks get a read-only token). The report is in the job summary."
        exit 0

    - name: Result
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "${CODE:-2}"
