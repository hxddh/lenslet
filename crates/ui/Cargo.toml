[package]
name = "lenslet-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lenslet-core = { path = "../core" }
anyhow = "1"
futures = "0.3"
gpui = "0.2.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
